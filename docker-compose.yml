# Local PostgreSQL for RUNNING THE APP — the dev database and the Playwright
# e2e one.
#
# Not used by `mvn verify`: the *IT suite starts its own throwaway container
# through Testcontainers (see PostgresContainerSupport), so it needs nothing
# from here.
#
# Version pinned to 16 to match both the Testcontainers image and the e2e job's
# service container, so every PostgreSQL this project talks to is the same one.
services:
  postgres:
    image: postgres:16
    container_name: ticketwave-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      # Creates the dev database. The other two come from the init script
      # below, which the entrypoint runs only on FIRST initialisation of an
      # empty data volume — see docs/testing.md if you need to re-run it.
      POSTGRES_DB: ticketwave
    ports:
      # Host port is overridable because 5432 is frequently already taken by a
      # natively installed PostgreSQL. If `docker compose up` fails to bind,
      # either stop that service or run with DB_PORT=5433 (and export the same
      # DB_PORT for mvn, which reads it via application-test.yml).
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # Same probe CI uses, so `depends_on: service_healthy` and the CI job
      # agree on what "ready" means.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
