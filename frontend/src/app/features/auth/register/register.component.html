<div class="card auth-card">
  <h2>Create an account</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.dirty && form.controls.password.hasError('minlength')) {
        <span class="form-error">Password must be at least 8 characters.</span>
      }
    </div>

    <button class="btn" type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Creating…' : 'Register' }}
    </button>
  </form>

  <p class="hint">Already have an account? <a routerLink="/login">Log in</a></p>
</div>
