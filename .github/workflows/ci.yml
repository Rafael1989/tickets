name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per branch: the integration tests share a single PostgreSQL
  # database, so overlapping runs on the same ref can interfere with each other.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The *IT suite runs against a real PostgreSQL, never H2 — Liquibase
        # migrations, SELECT ... FOR UPDATE and PostgreSQL's abort-the-whole-
        # transaction behaviour on constraint violations are exactly what those
        # tests exist to verify. Locally this is a developer's own instance
        # (see docs/testing.md); here it is a service container.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ticketwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # `verify`, not `test`: the coverage gate is bound to the verify phase and
      # grades unit + integration coverage merged. `mvn test` alone would skip
      # every *IT and run no gate at all.
      # ./mvnw pins the Maven version so a runner image upgrade cannot change
      # what this build runs. It is NOT what fixes the cross-ClassRealm
      # ClassCastException this job first died on — 3.9.16 reproduces that
      # just as readily; see backend/.mvn/maven.config for the actual fix.
      - name: Build, test and enforce coverage
        run: ./mvnw -B clean verify
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ticketwave_test
          DB_USERNAME: postgres
          DB_PASSWORD: root

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-merged
          path: backend/target/site/jacoco-merged
          if-no-files-found: warn

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # --watch=false is required: `npm test` (ng test) watches by default and
      # would never exit, hanging the job until it times out.
      - name: Unit tests
        run: npx ng test --watch=false
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Longer than the default because this job builds the backend jar, boots
    # Spring, and compiles the Angular dev server before a single test runs.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          # A third database, separate from ticketwave (dev) and
          # ticketwave_test (the *IT suite): e2e/global-setup.ts TRUNCATEs
          # every table it finds, so it must never share one with them.
          POSTGRES_DB: ticketwave_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Tests are skipped here on purpose: the backend job above already runs
      # them and enforces the coverage gate. This build exists only to produce
      # a runnable jar.
      - name: Build backend jar
        run: ./mvnw -B -DskipTests package
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Backgrounded rather than run through playwright's `webServer`: the
      # config deliberately has no webServer entry (see its Javadoc), so both
      # servers are started here and polled until they answer.
      - name: Start backend on 8081
        run: |
          # Not a bare glob: the Spring Cloud Contract plugin also emits
          # ticketwave-backend-<version>-stubs.jar into target/, and passing
          # two paths to `java -jar` is an error.
          JAR=$(ls target/*.jar | grep -v -- '-stubs\.jar$' | head -1)
          echo "starting $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
          for i in $(seq 1 60); do
            # /v3/api-docs, NOT an /api/... resource. A readiness probe must
            # have no side effects, and this one did: GET /api/schedules/1
            # against the still-unseeded database made ScheduleCatalogCache
            # store an empty scheduleStaticInfo under key 1 (30s TTL). Playwright's
            # global-setup then TRUNCATEs with RESTART IDENTITY, so the seeded
            # schedule *is* id 1 - and the search found the id but got the stale
            # empty back, returning 200 with an empty list. The golden-path test
            # failed on a cache entry this very loop had planted.
            # Reproduced locally by replaying that exact order; passes once the
            # probe stops touching schedule data.
            # It is also outside /api/*, so it does not consume the rate-limit
            # bucket the suite shares. -f so only a 2xx counts as ready.
            if curl -sf -o /dev/null http://localhost:8081/v3/api-docs; then
              echo "backend up after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "backend never became reachable"; tail -100 backend.log; exit 1
        working-directory: backend
        env:
          SERVER_PORT: 8081
          JWT_SECRET: e2e-only-secret-key-at-least-32-bytes-long
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ticketwave_e2e
          DB_USERNAME: postgres
          DB_PASSWORD: root

      # 4201 is angular.json's configured serve port and playwright.config.ts's
      # baseURL; proxy.conf.json forwards /api to the backend started above.
      - name: Start frontend on 4201
        run: |
          nohup npx ng serve --port 4201 > frontend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:4201; then
              echo "frontend up after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "frontend never became reachable"; tail -100 frontend.log; exit 1
        working-directory: frontend

      - name: Playwright tests
        run: npm run e2e
        working-directory: frontend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          E2E_DB_NAME: ticketwave_e2e
          DB_USERNAME: postgres
          DB_PASSWORD: root

      # Printed into the job log, not only uploaded: an artifact has to be
      # downloaded through the web UI before anyone can read it, which is a
      # poor place to put the one piece of evidence a failure turns on. The
      # log is what gets copied and pasted.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "===== seeded rows in ticketwave_e2e ====="
          PGPASSWORD=root psql -h localhost -U postgres -d ticketwave_e2e \
            -c "select route_id, type, origin, destination from routes" \
            -c "select schedule_id, route_id, departure_time, status, base_fare from schedules" \
            -c "select seat_id, schedule_id, seat_number, status from seats" || true
          echo "===== backend.log (last 120 lines) ====="
          tail -120 backend/backend.log || true
          echo "===== frontend.log (last 60 lines) ====="
          tail -60 frontend/frontend.log || true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/frontend.log
            backend/backend.log
          if-no-files-found: ignore
