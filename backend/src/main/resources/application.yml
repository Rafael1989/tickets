spring:
  application:
    name: ticketwave-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketwave}
    username: ${DB_USERNAME:ticketwave}
    password: ${DB_PASSWORD:ticketwave}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ticketwave-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fails a checkout fast rather than queuing requests indefinitely
      # behind a saturated pool.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    # Pinned to the same values as spring.datasource.* (via property
    # placeholder, so this always tracks whatever spring.datasource.url
    # actually resolves to, including test overrides) rather than relying on
    # the routing DataSource bean in DataSourceRoutingConfig — migrations
    # must always run against the primary, never a replica.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ticketwave:
  datasource:
    # Read-replica readiness (see DataSourceRoutingConfig): every read-only
    # @Transactional method already routes here automatically. Blank by
    # default, which falls back to the primary connection above — a genuine
    # no-op until these are actually set to a replica's connection info.
    replica:
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USERNAME:}
      password: ${DB_REPLICA_PASSWORD:}
  jwt:
    # No fallback default on purpose: a shared, publicly-known secret baked
    # into source control would let anyone forge a valid JWT (including
    # ADMIN). Every environment — including local dev — must set JWT_SECRET
    # explicitly; startup fails fast if it's missing rather than silently
    # running with a guessable key.
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-minutes: ${JWT_REFRESH_TTL_MINUTES:10080}
  inventory:
    seat-hold-ttl-minutes: ${SEAT_HOLD_TTL_MINUTES:10}
    hold-sweep-interval-ms: ${SEAT_HOLD_SWEEP_INTERVAL_MS:60000}
  pricing:
    last-minute-threshold-hours: ${PRICING_LAST_MINUTE_THRESHOLD_HOURS:24}
    last-minute-surcharge-rate: ${PRICING_LAST_MINUTE_SURCHARGE_RATE:0.25}
    early-bird-threshold-days: ${PRICING_EARLY_BIRD_THRESHOLD_DAYS:30}
    early-bird-discount-rate: ${PRICING_EARLY_BIRD_DISCOUNT_RATE:0.10}
    high-occupancy-threshold: ${PRICING_HIGH_OCCUPANCY_THRESHOLD:0.80}
    high-occupancy-surcharge-rate: ${PRICING_HIGH_OCCUPANCY_SURCHARGE_RATE:0.15}
    low-occupancy-threshold: ${PRICING_LOW_OCCUPANCY_THRESHOLD:0.20}
    low-occupancy-discount-rate: ${PRICING_LOW_OCCUPANCY_DISCOUNT_RATE:0.05}
  refund:
    full-refund-threshold-days: ${REFUND_FULL_THRESHOLD_DAYS:7}
    partial-refund-threshold-hours: ${REFUND_PARTIAL_THRESHOLD_HOURS:24}
    partial-refund-rate: ${REFUND_PARTIAL_RATE:0.50}
  rate-limit:
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:60}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

server:
  port: ${SERVER_PORT:8081}
  # Lets embedded Tomcat's RemoteIpValve rewrite request.getRemoteAddr() from
  # X-Forwarded-For — but only when the immediate TCP peer matches Tomcat's
  # default internalProxies pattern (loopback/private ranges), so a direct
  # internet client can't spoof the header to dodge rate limiting. Without
  # this, RateLimitingFilter (which keys on getRemoteAddr()) sees only the
  # reverse proxy's address once deployed behind one.
  forward-headers-strategy: native

logging:
  level:
    com.ticketwave: INFO
