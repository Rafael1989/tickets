# Activated via @ActiveProfiles("test") (see AbstractIntegrationTest). Only
# overrides what needs to differ from application.yml — everything else
# (Hikari tuning, pricing/refund config, etc.) inherits from the base file.
#
# DATABASE SAFETY: there is deliberately no spring.datasource block here. The
# connection is supplied at runtime by @DynamicPropertySource from the
# throwaway Testcontainers instance (PostgresContainerSupport), which wins over
# anything a file could set. This replaces the previous safeguard — a default
# database name deliberately different from the dev one — with a stronger
# guarantee: there is no URL left for a forgotten env var to resolve to, so a
# test run cannot address a real database at all.
ticketwave:
  jwt:
    # Fixed, well-known, non-secret test key — the opposite policy from
    # application.yml's JWT_SECRET (which has no default on purpose). A test
    # environment gains nothing from an unguessable secret and a missing
    # env var here should never block a local test run.
    secret: ${JWT_SECRET:test-only-secret-key-at-least-32-bytes-long}
  rate-limit:
    # Generous on purpose: IT tests exercising public endpoints (register,
    # login, search) repeatedly in one run should never trip the same
    # limiter tuned for real traffic.
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    com.ticketwave: INFO
    org.hibernate.SQL: WARN
