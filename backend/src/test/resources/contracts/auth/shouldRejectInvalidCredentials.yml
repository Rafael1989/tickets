name: shouldRejectInvalidCredentials
description: POST /api/login with a wrong password returns the standard error body shape, not a raw stack trace.
request:
  method: POST
  url: /api/login
  headers:
    Content-Type: application/json
  body:
    username: "alice"
    password: "wrong-password"
response:
  status: 401
  headers:
    Content-Type: application/json
  body:
    status: 401
    error: "INVALID_CREDENTIALS"
