name: shouldLoginSuccessfully
description: POST /api/login with correct credentials returns a bearer access token.
request:
  method: POST
  url: /api/login
  headers:
    Content-Type: application/json
  body:
    username: "alice"
    password: "password123"
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    accessToken: "jwt-token"
    tokenType: "Bearer"
    expiresInSeconds: 900
